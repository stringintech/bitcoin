name: CI
on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1

defaults:
  run:
    shell: bash

jobs:

  windows-cross-mingw-gcc15:
    name: 'Windows-cross to x86_64, ucrt, Debian sid GCC 15 experiment'
    runs-on: ubuntu-24.04
    # Temporary CI reduction for a focused Windows MinGW investigation.
    # Keep only the Linux cross-build path so the workflow stays fast and reversible.
    if: ${{ vars.SKIP_BRANCH_PUSH != 'true' || github.event_name == 'pull_request' }}
    timeout-minutes: 120

    env:
      FILE_ENV: './ci/test/00_setup_env_win64.sh'
      DANGER_CI_ON_HOST_FOLDERS: 1

    steps:
      - name: Annotate with pull request number
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=debug_pull_request_number_str::${{ github.event.number }}"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || '' }}

      - name: Note focused CI scope
        run: |
          echo "::notice title=Focused CI::Running only the Linux MinGW cross-build experiment to isolate the Windows toolchain failure."

      - name: Configure environment
        uses: ./.github/actions/configure-environment

      - name: Report Debian sid MinGW package candidates
        run: |
          source "$FILE_ENV"
          docker run --rm "$CI_IMAGE_NAME_TAG" bash -lc '
            set -o errexit -o pipefail
            apt-get update
            apt-cache policy \
              g++-mingw-w64-ucrt64 \
              gcc-mingw-w64-ucrt64-x86-64 \
              mingw-w64-ucrt-x86-64-dev \
              nsis
          '

      - name: Restore caches
        id: restore-cache
        uses: ./.github/actions/restore-caches

      - name: Configure Docker
        uses: ./.github/actions/configure-docker
        with:
          cache-provider: gha

      - name: CI script
        run: ./ci/test_run_all.sh

      - name: Save caches
        uses: ./.github/actions/save-caches
        if: always()
